<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="nfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="90" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Card Body Outline -->
  <g transform="translate(64, 96)">
    <rect width="384" height="240" rx="28" fill="#090d16" stroke="#334155" stroke-width="4"/>
    
    <!-- Chip -->
    <rect x="40" y="44" width="76" height="58" rx="8" fill="url(#chipGrad)" stroke="#fef08a" stroke-width="2"/>
    <!-- Chip internal lines -->
    <line x1="40" y1="63" x2="116" y2="63" stroke="#78350f" stroke-width="2"/>
    <line x1="40" y1="83" x2="116" y2="83" stroke="#78350f" stroke-width="2"/>
    <line x1="78" y1="44" x2="78" y2="102" stroke="#78350f" stroke-width="2"/>

    <!-- Contactless Wave Icon (NFC) -->
    <g transform="translate(290, 48)" stroke="url(#nfcGrad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow)">
      <!-- Wave 1 -->
      <path d="M 0 54 A 18 18 0 0 1 0 10"/>
      <!-- Wave 2 -->
      <path d="M 16 62 A 34 34 0 0 1 16 2"/>
      <!-- Wave 3 -->
      <path d="M 32 70 A 50 50 0 0 1 32 -6"/>
    </g>

    <!-- Cardholder name mockup lines -->
    <rect x="40" y="148" width="160" height="18" rx="5" fill="#f8fafc" fill-opacity="0.9"/>
    <rect x="40" y="176" width="100" height="12" rx="4" fill="#94a3b8" fill-opacity="0.7"/>

    <!-- NFC Tools Ready Badge -->
    <g transform="translate(230, 168)">
      <rect width="114" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
      <text x="57" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">NFC APP</text>
    </g>
  </g>

  <!-- Bottom App Label -->
  <text x="256" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="1">NFC STUDIO</text>
  <text x="256" y="440" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="2">SMART CARD APP</text>
</svg>
